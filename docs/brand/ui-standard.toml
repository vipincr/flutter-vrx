# The vrx UI standard: every number a second implementation has to match, and the words it has to honour.
#
# This file is the single source (plan 0061 D4) and vrx's design system (plan 0025 D1): its values are vrx's defaults, and a
# brand's design.toml overrides any value key and nothing else (D2). scripts/lib/design_resolve.py is the one merger: it lays a
# brand's values over this file, holds the result to the usability floors ([floor], the contrast pairs, the touch minimum, the
# tiers' durations; D11) and writes the resolved standard, which is what every generator reads. With no design.toml the
# resolved standard is this file, byte for byte. scripts/lib/make_ui_standard.py turns it into ui_metrics' headers (the
# facts no design overrides in ui_standard.h; the tokens a design may set by identity in ui_tokens.h, the SDK's view, and by
# value in private/ui_brand.h, the runtime's), the display class (ui_class.h), the design system's tables (ui_kit/ui_design.h)
# and the expectations the host tests hold the hand-written tables to (tests/ui_standard_expect.h); the gate's
# ui-standard-generated refuses a stale copy. A second implementation (the Flutter kit in vrx-linux) vendors the resolved file, pinned by hash,
# and generates its own tables from it.
#
# UNITS ARE NORMATIVE. A length is in millimetres, a type size in points, a time in milliseconds, a stiffness in the
# units of a spring of mass 1. Pixels are derived: here from the panel's density (CONFIG_VRX_PANEL_PPI, UI_MM), on a
# host that has no density from a scale over a 480 px short side. Both are sanctioned; a length that is written in
# pixels anywhere is a defect in whichever implementation wrote it.
#
# A component names tokens and never values: "colour.primary" is a slot, "type.label" a type role, "radius_mm.sm",
# "border_px.hairline", "spacing_mm.md", "control_mm.sm", "icon_mm.md", "size_mm.icon_button" and "opacity_permille.hover" a
# row of those tables, "elevation.2" and "gradient.signal" a level and a gradient below, "micro.press" a microinteraction,
# "duration_ms.fast" a duration of [motion.duration_ms], and "class.pressed_layer_permille" the display class's field.
#
# A DESIGN FINDING (a flaw a test, a walk or a bench session shows in a drawn UI) is fixed in exactly one of three places here,
# never in widget code (G085 refuses a literal there, so a local patch cannot hold):
#   1. a token's value, when vrx's default is wrong (the hairline is too faint on one panel class: [border_px]);
#   2. a component spec, when a state or a part is missing or names the wrong token ([component.*]);
#   3. a floor row ([floor.<name>]), when the flaw is a kind of mistake any brand could make. A row names its kind, what it
#      catches and where it came from (a standard, an owner's statement, or the test, board and date of the finding); the
#      resolver checks every row of a kind with one function, so a new row is data and a fixture, never a resolver edit.
# Then `scripts/lib/design_build.py` regenerates what the change reaches, and `--brands` resolves every brand package again,
# so the floor a finding added on one device adapts (or refuses) every brand's design on the next run, each adaptation
# logged with the row's catches and source. Worked example (tests/test_design_build.py): "focus ring invisible on a
# teal chip": the ring was drawn flush on the chip's own teal fill; a focus row with gap_below_mm checks a ring that touches
# its control against the control's fills, and the resolver gives a flush ring its gap back.

[standard]
version = 1

# --- spacing and shape -----------------------------------------------------------------------------------------------
# The vocabulary of every pad, margin and gap. A layout that reaches outside it has not been thought about
# (UI_SPACE_EXACT names the rare exception and its reason).

[spacing_mm]
xs = 1
sm = 2
md = 3
lg = 4
xl = 6
edge_inset = 2        # between the glass edge and the client area
flush = 0             # a part drawn against another, with no gap

# vrx's corners are the strata's: straight edges, rounded only as far as a finished edge needs. sm and md are the two the
# kits have always drawn; xs is a check box's corner, lg a sheet's, xl the most anything is rounded. pill is longer than any
# control is tall, and both kits clamp a radius to half the short side (LVGL clamps it, Flutter scales an RRect), so it
# draws a capsule.
[radius_mm]
sm = 1
md = 2
xs = 0.5
lg = 3
xl = 4
pill = 100

# Window size classes (plan 0062 D20), Material's (compact below 600 dp wide and 480 dp high, medium to 840 and 900, expanded from
# there) at 160 dp to the inch, in tenths of a millimetre: the two edges between compact and medium and between medium and expanded. An
# applet reads a class and never a pixel count, so a layout is chosen by how much room there is.
[window]
width_x10mm = [952, 1334]
height_x10mm = [762, 1429]
# The splits a wide window's panes take (plan 0072 D2), the figure's share against its support's: even, the figure leading (a
# dial with a rail of choices beside it), and the support leading (a small figure beside readings that need the width).
panes_even = [1, 1]
panes_figure_leads = [5, 3]
panes_support_leads = [1, 2]

# Sizes that are physical whatever the panel's density.
[size_mm]
# Along the axis a target shares with its siblings in one control (a segmented row's width, a rail's height): WCAG 2.2's target
# minimum, 24 CSS px (6.35 mm), on whole tenths. A cell is still a finger across; a row of seven at 9 mm both ways needed 546 px
# of a 410 px row on a 219 PPI panel and went to two lines (2026-10-19). A component's along-axis width names it
# (segmented's segment), [floor.touch_along] holds it, and like the touch minimum no viewing class scales it.
touch_along = 6.4
icon_button = 5       # a glyph that is itself a control
status_button = 4     # a glyph in the status strip, an indicator and not a target
qr_min = 18           # the smallest a QR code can be for a phone's camera to read
drawer_pull_min = 27  # how far the quick drawer is pulled before it opens

# How tall a control is (a button, a field, a list row), and so how tall its target is. Each is at least the touch floor
# ([floor.touch_target]): the resolver raises one that is not, so no brand can make a control a finger misses.
[control_mm]
sm = 9
md = 10
lg = 12

# A glyph's square: md beside body text (about 1.3 of its em), xs beside a caption, lg alone in an empty state.
[icon_mm]
xs = 3
sm = 3.5
md = 4.5
lg = 6

# The opacities a state or a layer draws at, in permille. A pressed control's layer is the display class's
# (class.*.pressed_layer_permille), since a panel without greys inverts instead.
[opacity_permille]
disabled = 380        # a control that cannot be used (Material's 38 %)
hover = 80            # the layer over a control a pointer rests on
opaque = 1000         # no transparency: what a tier realisation sets where a panel cannot draw a fade (e-paper's disabled look)
scrim = 600           # the shade behind a dialog

# Lengths in device pixels, and the only ones. A line is drawn on whole pixels, so its width is a count of them and not a
# fraction of a millimetre: a second implementation has to draw the same line, and scaling it would give a hairline of 1.3
# pixels that anti-aliases to grey on a panel with four greys. hairline and regular are what the 219 PPI reference panel
# draws well, and the focus frame's smallest size (UI_FOCUS_MIN) is derived from them.

[border_px]
hairline = 2          # a rule, a thin frame, the seam between two controls
regular = 3           # a control's frame, the focus frame
thick = 4             # a selected frame; the outline of the highest surfaces on e-paper
none = 0              # no frame: a control that takes no tap (a disabled key) shows none

# --- elevation (plan 0025 D4) ----------------------------------------------------------------------------------------
# How far a surface stands off the one below it, and what each display can draw of that. full: a shadow in the shadow slot
# (offset down dy_mm, blurred blur_mm, grown spread_mm, at opacity), for a GPU or a software path fast enough for it.
# light: the surface lifted tone_step steps of CIE L* toward the text, and a border, where a shadow costs too much. grey: a
# border alone, since a shadow on four greys is a smudge. epaper: an outline. A border names a border_px row, or "none".
# vrx's elevation is the kit's (plan 0058 D12): one light above and a little before the screen, so every shadow falls
# straight down, darker and softer a level at a time; below the full tier a frame a step heavier for each level. The kit
# caps a shadow's blur at 48 px whatever the panel, since blur is the costliest thing LVGL draws in software (ui_ds.c).

[elevation.0]
full = { dy_mm = 0, blur_mm = 0, spread_mm = 0, opacity = 0.0 }
light = { tone_step = 0, border = "none" }
grey = { border = "none" }
epaper = { outline = "none" }

[elevation.1]
full = { dy_mm = 0.3, blur_mm = 0.8, spread_mm = 0, opacity = 0.20 }
light = { tone_step = 2, border = "border_px.hairline" }
grey = { border = "border_px.hairline" }
epaper = { outline = "border_px.hairline" }

[elevation.2]
full = { dy_mm = 0.6, blur_mm = 1.4, spread_mm = 0, opacity = 0.25 }
light = { tone_step = 4, border = "border_px.hairline" }
grey = { border = "border_px.regular" }
epaper = { outline = "border_px.regular" }

[elevation.3]
full = { dy_mm = 1.0, blur_mm = 2.2, spread_mm = 0, opacity = 0.30 }
light = { tone_step = 6, border = "border_px.regular" }
grey = { border = "border_px.thick" }
epaper = { outline = "border_px.thick" }

[elevation.4]
full = { dy_mm = 1.5, blur_mm = 3.2, spread_mm = 0, opacity = 0.35 }
light = { tone_step = 8, border = "border_px.regular" }
grey = { border = "border_px.thick" }
epaper = { outline = "border_px.thick" }

[elevation.5]
full = { dy_mm = 2.2, blur_mm = 4.6, spread_mm = 0, opacity = 0.40 }
light = { tone_step = 10, border = "border_px.thick" }
grey = { border = "border_px.thick" }
epaper = { outline = "border_px.thick" }

# --- gradients (plan 0025 D4) ----------------------------------------------------------------------------------------
# A named gradient: its angle in degrees (0 runs left to right, 90 top to bottom), its stops (a slot, where it sits in
# permille of the length, and optionally an opacity row), and what draws in its place below the full tier: one slot per
# tier. vrx has few, and none is decoration for its own sake: one accent per surface.

[gradient.strata]           # a hero surface's wash: the strata's light falling from above
angle = 90
stops = [{ colour = "colour.surface_high", at = 0 }, { colour = "colour.surface", at = 1000 }]
fallback = { light = "colour.surface_high", grey = "colour.surface", epaper = "colour.surface" }

[gradient.signal]           # the accent in motion: progress, a level, the lit face of the mark
angle = 0
stops = [{ colour = "colour.primary", at = 0 }, { colour = "colour.secondary", at = 1000 }]
fallback = { light = "colour.primary", grey = "colour.primary", epaper = "colour.primary" }

[gradient.scrim]            # text over a picture: the shadow slot fading out across it
angle = 0
stops = [{ colour = "colour.shadow", at = 0, opacity = "opacity_permille.scrim" }, { colour = "colour.shadow", at = 1000, opacity = "opacity_permille.hover" }]
fallback = { light = "colour.inverse", grey = "colour.inverse", epaper = "colour.inverse" }

[gradient.skeleton]         # a place holding content still loading
angle = 0
stops = [{ colour = "colour.surface", at = 0 }, { colour = "colour.surface_high", at = 370 }, { colour = "colour.surface", at = 630 }]
fallback = { light = "colour.surface_high", grey = "colour.surface", epaper = "colour.surface" }

# --- gestures --------------------------------------------------------------------------------------------------------
# A swipe is a distance AND a speed: the distance separates it from a tap (Android's boundary is 8 dp, about 1.3 mm), the
# speed keeps a long press safe, whose finger drifts some 24 px/s on a 219 PPI panel against the 60 px/s floor.

[gesture]
swipe_min_mm = 2.5
swipe_min_px_per_s = 60    # the one speed written in pixels: about 7 mm/s at the reference 219 PPI (plan 0061 A rechecked it on traces)
touch_slop_mm = 2          # travel past which a contact is no longer a tap
wheel_step_mm = 4.5        # one step of a mouse wheel

# --- motion timing ---------------------------------------------------------------------------------------------------
# Things that move do so on the springs below ([springs], [micro]); a spring has no duration, it has a stiffness. What is
# timed instead (a scroll, a page turn, the focus ring's move on a scanned panel, a progress bar's fill, a skeleton's sweep)
# takes one of these durations, and each tier caps them ([floor.motion]). An easing names the spring a timed
# animation's curve follows, so a curve is never spelled twice.

[motion.duration_ms]
fast = 200                 # a scroll, a page turn and the focus ring's move on a scanned panel; a press, a tab
normal = 300               # a sheet or a dialog opening
slow = 600                 # a progress bar's fill, a celebration

[motion.easing]
standard = "springs.standard.spatial"         # content moving from one place to another
out = "springs.standard.effects"              # something arriving: fast, settling, never past its stop
spring = "springs.expressive.spatial"         # a floating thing, which may overshoot

# --- type ------------------------------------------------------------------------------------------------------------
# A role is chosen by what the text IS and set by its SIZE_PT: its size in points on a device whose median body size is the
# reference, [type_band] reference_median_pt (9.9 pt, the handheld). On any other device it moves with the median, by the
# same points, onto that device's band of 0.5 pt sizes and inside it ([type_band]; scripts/lib/type_band.py resolves it per
# density and per viewing class). Owner, 2026-11-15: "why shouldn't size_pt exist, it can just be a number relative to the per
# density". A role's step (its place in the 13 sizes) is computed, never written. Each role also has its weight (vrx ships Fira Sans at
# 300, 400 and 500), its leading (line height over the size), its tracking in em, the family it is set in ([family]) and its
# case. The first seven are the roles the kits have always drawn; the rest are the reference's scale (display, headline,
# title, body and label at three sizes, caption, overline), where the unsuffixed role is the middle size, and `terminal` is
# the console's: the smallest step, in the fixed-width family, so a console fits its columns. vrx sets its large type light
# and its labels medium. A figure larger than the band (the clock's numerals, a hero reading) is not a role: it is the
# applet's own glyph set (scripts/make/make_applet_glyphs.py), counted in that applet's memory.
#
# The sizes are the band's at the reference median, from the sizes before it: display 14.5 -> 12.9 (the top), title 12.5 ->
# 12.4, subtitle 11.2 -> 11.4, subtext and code 8.5 -> 8.4, micro 6.6 -> 7.0 (the least its capitals allow at 362 mm), and the
# reference's roles to the nearest size, the larger ones held to the top (display_lg 18.6, display_sm 13.5, headline_lg 14.5,
# headline 13.5, title_lg 13.5). The old clock role (42.1 pt) is gone: its users carry glyph sets.

[type.display]
size_pt = 12.9
weight = 300
leading = 1.15
tracking_em = -0.01
family_role = "display"
transform = "none"

[type.title]
size_pt = 12.4
weight = 500
leading = 1.25
tracking_em = 0.0
family_role = "ui"
transform = "none"

[type.subtitle]
size_pt = 11.4
weight = 500
leading = 1.3
tracking_em = 0.0
family_role = "ui"
transform = "none"

[type.body]
size_pt = 9.9
weight = 400
leading = 1.45
tracking_em = 0.0
family_role = "ui"
transform = "none"

[type.subtext]
size_pt = 8.4
weight = 400
leading = 1.4
tracking_em = 0.0
family_role = "ui"
transform = "none"

[type.micro]
size_pt = 7.0
weight = 400
leading = 1.25
tracking_em = 0.02
family_role = "ui"
transform = "none"

[type.code]
size_pt = 8.4
weight = 400
leading = 1.4
tracking_em = 0.0
family_role = "mono"
transform = "none"

[type.terminal]
size_pt = 6.9
weight = 400
leading = 1.3
tracking_em = 0.0
family_role = "mono"
transform = "none"

[type.display_lg]
size_pt = 12.9
weight = 300
leading = 1.15
tracking_em = -0.02
family_role = "display"
transform = "none"

[type.display_sm]
size_pt = 12.9
weight = 300
leading = 1.15
tracking_em = -0.01
family_role = "display"
transform = "none"

[type.headline_lg]
size_pt = 12.9
weight = 500
leading = 1.2
tracking_em = 0.0
family_role = "ui"
transform = "none"

[type.headline]
size_pt = 12.9
weight = 500
leading = 1.2
tracking_em = 0.0
family_role = "ui"
transform = "none"

[type.headline_sm]
size_pt = 12.4
weight = 500
leading = 1.25
tracking_em = 0.0
family_role = "ui"
transform = "none"

[type.title_lg]
size_pt = 12.9
weight = 500
leading = 1.25
tracking_em = 0.0
family_role = "ui"
transform = "none"

[type.title_sm]
size_pt = 11.4
weight = 500
leading = 1.3
tracking_em = 0.0
family_role = "ui"
transform = "none"

[type.body_lg]
size_pt = 11.4
weight = 400
leading = 1.45
tracking_em = 0.0
family_role = "ui"
transform = "none"

[type.body_sm]
size_pt = 8.4
weight = 400
leading = 1.4
tracking_em = 0.0
family_role = "ui"
transform = "none"

[type.label_lg]
size_pt = 9.9
weight = 500
leading = 1.3
tracking_em = 0.01
family_role = "ui"
transform = "none"

[type.label]
size_pt = 8.4
weight = 500
leading = 1.3
tracking_em = 0.01
family_role = "ui"
transform = "none"

[type.label_sm]
size_pt = 7.4
weight = 500
leading = 1.3
tracking_em = 0.02
family_role = "ui"
transform = "none"

[type.caption]
size_pt = 7.4
weight = 400
leading = 1.3
tracking_em = 0.01
family_role = "ui"
transform = "none"

[type.overline]
size_pt = 7.4
weight = 400
leading = 1.3
tracking_em = 0.08
family_role = "mono"
transform = "upper"

# The family each role is set in, by fontconfig name (Flutter names it; LVGL's faces are generated from its files, D6).
[family]
ui = "Fira Sans"
display = "Fira Sans"
mono = "Fira Code"

# The panel densities the type scale has a rung for (scripts/lib/make_type_scale.py): a font set per density, chosen by the
# preprocessor, so a board whose panel is not listed here does not compile. The list is the standard's, never read off board
# folders, so a board lives in one project's tree and the runtime still draws for it. 179 is the Sharp Brain PW-SH7 (lvgl-vrx),
# 187 the N6570-DK, 219 the reference e-paper panel (qemu_s3), 294 the 1280 x 720 colour panels (emu_p4, qemu_lcd).
[type_scale]
densities_ppi = [179, 187, 219, 294]

# --- the type band (plan 0025 D15) ------------------------------------------------------------------------------------
# Owner, 2026-11-15: "there has to be a built in upper and lower bounds for fonts, taking the median size as the one we have
# calculated based on screen size and pixel density ... a +/- 3 point change with 0.5 point steps should be the bounding
# limits (these can be set as configurable too) ... anything beyond should be built in the by the applet as a glyph or within
# its own memory budget". scripts/lib/type_band.py is the one implementation.
#
#   median      the body size whose x-height (the face's OS/2 sxHeight over its em) subtends arcmin_x at the device's viewing
#               distance; the distance is its class's (distance_mm), the class is chosen by the panel's diagonal
#               (class_max_diagonal_mm; a density's reference panel is diagonal_mm), and the median is a whole tenth of a point.
#   band        median - below_pt .. median + above_pt in step_pt steps (13 sizes). A role's size there is its size_pt moved by
#               the median's distance from reference_median_pt, onto the nearest of the 13 (half a step rounds up), and held
#               to the band: role_pt = median + step x step_pt, step = round((size_pt - reference_median_pt) / step_pt).
#               The bottom of the band is never under min_arcmin of CAP height (OS/2 sCapHeight) at that distance: for a face
#               whose capitals need more than median - below_pt, the bottom step is that minimum rounded up to a tenth.
#   arcmin_x    calibrated once so that a handheld body in vrx's ui face (Fira Sans, x-height 527/1000) is the 9.9 pt vrx has
#               always set: 2 atan(9.9 pt x 0.527 / 2 / 362 mm) = 17.479 arcmin. It sits inside the 16 to 22 arcmin character
#               height that ISO 9241-303 and the usability guides built on it recommend (16 minimum, 20 to 22 preferred), though
#               that figure is a capital's: the same body's capitals subtend 22.85 arcmin. `type_band.py --calibrate` re-derives it.
#   rung        a board's difference: [type_band.rung.<ppi>] sets any of distance_mm, below_pt, above_pt for the boards at that
#               density. The generated headers are compiled per density (D10, no run-time choice), so a rung is the board's
#               one place to move or narrow its band; a Kconfig would need the build to compute a scale at configure time.
#   classes     a kit that is not compiled per density (Flutter) picks the viewing class from its panel's real diagonal and
#               reads that class's median, band and role sizes (`design_resolve.py --type-table --json`, "classes"), so the
#               formula lives here once.
# Viewing class scales what is SEEN (type, and the visual geometry a role sets), never what is TOUCHED: the touch minimum
# ([floor.touch_target] min_mm, UI_TOUCH_MM) and every component's hit are a finger's size, the same in every class and at
# every distance, so a wall panel's target is 9 mm like a phone's. A control's target is the larger of the touch minimum and its
# drawn size, and [floor.touch_target] holds the unscaled millimetres (a kit that scales geometry by class leaves these out).
# A brand sets none of this ([type_band] is a contract); it sets its roles' size_pt.
[type_band]
reference_median_pt = 9.9   # the median a role's size_pt is written at: the handheld body, and what arcmin_x is calibrated to
below_pt = 3
above_pt = 3
step_pt = 0.5
arcmin_x = 17.479
min_arcmin = 16

# Viewing distance by class, mm. handheld: the mean smartphone reading distance, 362 mm (Bababekova et al., Optometry and Vision
# Science 88(7), 2011: 36.2 cm). desk: 600 mm, inside the 500 to 700 mm that ISO 9241-5 and ANSI/HFES 100-2007 give for a desk
# display (their 500 mm minimum is the lower end). wall: 2000 mm, a chosen figure for a panel read across a room; no standard
# retrieved, so it is the one distance to close with a source before a wall-class board ships.
[type_band.distance_mm]
handheld = 362
desk = 600
wall = 2000

# The class a panel belongs to, by its diagonal: handheld to 230 mm (9 in), desk to 700 mm (27.5 in), wall above.
[type_band.class_max_diagonal_mm]
handheld = 230
desk = 700

# A density's reference panel, its diagonal in mm (width x height pixels over the density): 179 the PW-SH7 (854 x 480), 187 the
# N6570-DK (800 x 480), 219 the reference e-paper (800 x 480), 294 the 720 x 1280 panels. make_type_scale.py --check holds every
# board's own diagonal to its rung's class.
[type_band.diagonal_mm]
179 = 139
187 = 127
219 = 108
294 = 127

# --- the applets' glyph sets (plan 0025 D15) --------------------------------------------------------------------------
# What is larger than the band is the applet's own: a glyphs.toml beside its sources lists sets (name, the characters, size, family
# role, weight), scripts/make/make_applet_glyphs.py makes them, and an applet's sets together stay within budget_bytes of .rodata
# (bitmaps and glyph table) at every density, so the memory nobody budgeted for cannot grow in an applet's image unseen. The
# clock's numerals at its old 42.1 pt, 12 characters, are the largest set today (41 KB at the densest panel, 294 PPI; 23 KB at 219).
[applet_glyphs]
budget_bytes = 65536

# --- usability floors (plan 0025 D11) --------------------------------------------------------------------------------
# What no design may go below, one row per rule. design_resolve.py holds the merged design to every row, vrx's own values
# included, with one function per kind; a value that breaks a row moves to the nearest that meets it (a tone, a size, a
# reference put back), logged with the row's catches and source, and a structural break is refused. A brand sets none of
# this ([floor] is a contract). Kinds:
#   contrast    bg, fg (slots), min_x100 (WCAG ratio x 100), first_pass (legible in an e-paper refresh's one-bit pass).
#               In this order they are also UI_PAIRS, the grey maps' repair order and the Flutter kit's vrxPairFloors.
#   transit     min_x100: a fill animating from the page to the primary keeps its text above this on every frame.
#   min_size    paths (token paths; * matches any key; component.*.hit is each interactive component's target), and
#               min_mm, in physical millimetres that no viewing class scales (type sizes are the type_band row's).
#   focus       against (slots, or "own_fills": the fills of the component's root part in every variant and state),
#               min_x100, min_width_px, and gap_below_mm (optional: the row holds only rings set closer than this).
#   motion      paths, max_ms per tier: a timed animation is capped at its tier's.
#   paired_text a component part that sets text (type and colour) sits on a ground that is one of the contrast rows.
#   state_distinct  states, min_x100, realise (optional: state -> invert or outline): each of those states of an interactive
#               component differs from rest in every render tier after its colour map (a fill, frame or ink moved by
#               min_x100, a frame or outline added, taken or reweighted, an inversion; an opacity counts on a colour panel
#               only). A brand's reference that hides one is put back; else the row's realisation is written for that tier.
#   resolution  paths, step_mm: a length is held to the step the kits store it in (tenths of a millimetre), the nearest.
#   type_band   paths (the roles' size_pt): a size whose step (round((size_pt - reference_median_pt) / step_pt)) is outside
#               the band every density allows is moved to the band's edge at the reference median, and a role whose size at
#               some density is under min_arcmin of cap height is refused (type_band.py puts the band's bottom at that minimum,
#               so only a table the resolver and the type scale disagree on can fail it).

